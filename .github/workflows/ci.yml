name: ci

on: [push, pull_request]

jobs:
  warehouse:
    name: batch warehouse (Airflow ingestion code + dbt)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-dbt.txt
      - name: Unit tests
        run: make test
      - name: Extract, validate contracts, and load monthly batches
        run: make load
      - name: dbt build (models + tests)
        run: make dbt

  streaming:
    name: streaming (Spark Structured Streaming, files + Kafka)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
    env:
      PYTHONPATH: ${{ github.workspace }}
      LANDING_DIR: data/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt -r requirements-streaming.txt
      - name: Download source files
        run: python -m include.ingestion.cli extract
      - name: File source - two runs, simulated crash replay, verification
        run: bash streaming/run_demo.sh
      - name: Kafka source - produce, stream, verify
        run: |
          rm -rf data/stream
          python -c "from streaming.stream_job import connect; c=connect(); cur=c.cursor(); cur.execute('drop schema if exists streaming cascade'); c.commit()"
          python -m streaming.producer --sink kafka --bootstrap localhost:9092 --topic order_events
          python -m streaming.stream_job --source kafka --bootstrap localhost:9092 --topic order_events
          python -m streaming.verify
